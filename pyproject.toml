[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "dba-agent-lab"
version = "0.2.0"
description = "LLM-powered database-design assistant with persistent staged workflow"
requires-python = ">=3.10"
dependencies = ["rich>=13.7", "textual>=1.0,<2"]

[project.scripts]
dba-agent = "dba_agent.cli:main"

[tool.setuptools]
packages = ["dba_agent"]

[tool.setuptools.package-data]
dba_agent = ["prompts/*.txt"]
